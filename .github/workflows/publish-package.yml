name: publish distributions
on:
  push:
    branches:
    - main
    tags:
    - '*.*'
    - '*.*.*'
  pull_request:
    branches:
    - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        type: choice
        description: 'Publish to TestPyPI?'
        options:
        - false
        - true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  #v7.1.0
      with:
        python-version: '3.x'

    - name: Install python-build and twine
      run: |
        python -m pip install --upgrade pip meson-python
        python -m pip install build twine
        python -m pip list

    - name: Build a wheel and a sdist
      run: |
         #PYTHONWARNINGS=error,default::DeprecationWarning python -m build .
         python -m build .

    - name: Verify the distribution
      run: twine check --strict dist/*

    - name: List contents of sdist
      run: python -m tarfile --list dist/array_api_compat-*.tar.gz

    - name: List contents of wheel
      run: python -m zipfile --list dist/array_api_compat-*.whl

    - name: Upload distribution artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-artifact
        path: dist

  publish:
    name: Publish Python distribution to (Test)PyPI
    if: github.event_name != 'pull_request' && github.repository == 'data-apis/array-api-compat' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # Mandatory for publishing with a trusted publisher
    # c.f. https://docs.pypi.org/trusted-publishers/using-a-publisher/
    permissions:
      id-token: write
      contents: write
    # Restrict to the environment set for the trusted publisher
    environment:
      name: publish-package

    steps:
    - name: Download distribution artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist-artifact
        path: dist

    - name: List all files
      run: ls -lh dist

   # - name: Publish distribution 📦 to Test PyPI
   #   # Publish to TestPyPI on tag events of if manually triggered
   #   # Compare to 'true' string as booleans get turned into strings in the console
   #   if: >-
   #     (github.event_name == 'push' && startsWith(github.ref, 'refs/tags'))
   #     || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
   #   uses: pypa/gh-action-pypi-publish@v1.14.2
   #   with:
   #     repository-url: https://test.pypi.org/legacy/
   #     print-hash: true

    - name: Publish distribution 📦 to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        print-hash: true

    - name: Create GitHub Release from a Tag
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: dist/*
